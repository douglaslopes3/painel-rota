# Configuração do Painel de Rota (pipeline único `run_rota.py`).
# Toda regra declarada aqui vem de decisão registrada em docs/10_DECISOES.md (D-nn) ou está marcada como pendência (P-nn).
# Caminhos relativos são resolvidos a partir da raiz do projeto (a pasta ROTA/); absolutos passam direto.

projeto:
  nome: Painel de Rota · Projeto Rota (Atacado)
  pasta_dados: data/rota            # staging/, curated/, quality/ ficam aqui
  pasta_logs: data/rota/logs
  # JSON e HTML de cada execução nascem numa pasta LOCAL, fora do OneDrive (padrão do DN); só o publicado vai para a pasta sincronizada
  pasta_painel: "%LOCALAPPDATA%/Dori/ROTA/painel"

logs:
  manter_ultimos: 30                # logs e resumos de execução mantidos

fontes:
  # O MÊS de cada arquivo vem do CONTEÚDO (datas), nunca do nome. Dois arquivos da mesma fonte com o mesmo mês abortam:
  # substituir o arquivo do mês corrente, nunca adicionar (versão antiga vai para uma subpasta, ex.: _versoes/, que não é lida).
  # NOME dos arquivos (D-48, 22/09/2026): sempre <Fonte>_AAAA-MM (Rota_2026-09.xlsx, Mercanet_2026-09.csv, Pedidos_2026-09.csv),
  # tanto para o mês corrente quanto para os fechados. O pipeline não depende do nome; a convenção é para a operação não se perder na virada.
  rota:                             # rota planejada do mês · 1 linha = 1 cliente · construída pelo time de Atacado
    pasta: bases/Rota
    padroes_aceitos: ["Rota_*.xlsx"]
    aba: Base de Clientes
    # a coluna de data traz o mês no nome ("Datas Rota Setembro"): é localizada por padrão, sem acento e sem caixa (P-05)
    coluna_data_regex: "^DATAS? ROTA"
    colunas:                        # nome na planilha -> nome no staging
      "Supervisor": SUPERVISOR
      "Executivo": EXECUTIVO
      "Cód. cliente": COD_CLIENTE
      "canal": CANAL
      "cidade": CIDADE
      "Net Sales 25": NET_SALES_25
      "Net Sales 26": NET_SALES_26
      "Frequência anual 2025": FREQ_25
      "Frequência anual 2026": FREQ_26
      "Volume 25": VOLUME_25
      "Volume 26": VOLUME_26
    # Código do vendedor (N4 da hierarquia: 107, 118...). É a chave rota ↔ hierarquia (D-17): resiste a homônimo, troca de
    # pessoa e posição vaga. Enquanto a coluna não existir na planilha, a ligação é pelo NOME do executivo.
    colunas_opcionais:
      "Cód. vendedor": COD_VENDEDOR
      "Nome cliente": NOME_CLIENTE        # a rota do Gui vem SEM esta coluna (D-37); o nome das lojas vem do cadastro de clientes (D-38; Estrutura de Clientes desde a D-51)
    canais_esperados: [PRESENCIAL, TELEFONE]      # gabarito de conferência: valor fora da lista vira aviso, não é corrigido

  checkins:                         # Mercanet · timeline de check-in/check-out · 1 linha = 1 evento · extração acumulada do mês (D-06)
    pasta: bases/Mercanet
    padroes_aceitos: ["*.csv"]
    separador: ";"
    encoding: cp1252
    # D-42 (22/09/2026): a extração de 22/09 veio SEM segundos. Lista = formatos aceitos, tentados em ordem; data que não casa com
    # nenhum aborta. Para exigir um formato só, deixar um item.
    formato_data: ["%d/%m/%Y %H:%M:%S", "%d/%m/%Y %H:%M"]
    colunas:
      "USUÁRIO": LOGIN
      "NOME USUÁRIO": NOME_USUARIO
      "DATA EVENTO": DATA_HORA
      "CÓDIGO CLIENTE": COD_CLIENTE
      "NOME CLIENTE": NOME_CLIENTE
      "CIDADE CLIENTE": CIDADE
      "ESTADO": UF
      "EVENTO TIME LINE": EVENTO
    # NÃO vão para o staging (minimização, Etapa 7): ENDEREÇO CLIENTE, DESCRIÇÃO TIMELINE, LATITUDE e LONGITUDE (truncadas em inteiro na origem)
    eventos_esperados: [CHECKIN, CHECKOUT]
    logins_ignorados:               # descartados na leitura, contados no log. Confirmado em 18/09/2026 (D-30)
      TESTERTM: "usuário de teste (1 check-in em 01/09/2026, no cliente 1012816)"

  pedidos:                          # Mercanet · consulta de pedidos · 1 linha = 1 pedido · canal Atacado inteiro · acumulada do mês
    pasta: bases/Pedidos
    padroes_aceitos: ["*.csv"]
    separador: ";"
    encoding: cp1252
    formato_data: "%d/%m/%Y"
    colunas:
      "Pedido": PEDIDO
      "Código": COD_CLIENTE
      "Cliente": NOME_CLIENTE
      "Data de emissão": DATA_EMISSAO
      "Data Estimada de Entrega": DATA_ENTREGA_ESTIMADA
      "Data de faturamento": DATA_FATURAMENTO
      "Situação": SITUACAO
      "Valor total do pedido": VALOR_PEDIDO
      "Quantidade solicitada": QTD_SOLICITADA          # unidade não declarada na origem (P-02)
      "Valor total bruto": VALOR_BRUTO
      "Valor desconto": VALOR_DESCONTO
      "Representante": REPRESENTANTE
      "Cidade": CIDADE
      "UF": UF
    # NÃO vão para o staging: Ordem de compra, Sit. Embarque, Nota fiscal, Cliente CNPJ (17 são CPF), Desconto médio, Preço médio liquido
    # a última linha do arquivo é um rodapé de totais: sai dos dados e vira o GABARITO de reconciliação
    reconciliar: [VALOR_PEDIDO, QTD_SOLICITADA, VALOR_BRUTO]
    situacoes_esperadas: ["Aberto", "Fatur. Parcial", "Faturado", "Fatur. + Canc.", "Bloqueado", "Cancelado"]

  estrutura:                        # D-49 (02/10/2026): so N4 -> login do Mercanet. A hierarquia N1-N4 vem de `hierarquia` (abaixo)
    arquivo: bases/Estrutura/DePara_Estrutura_Rota.xlsx
    obrigatorio: true               # D-39 (18/09/2026): o de-para fechou — ausência ou problema ABORTA. false = só avisa (D-15)
    # posições (código N4) que podem ficar SEM login sem contar como problema: posto vago conhecido.
    posicoes_sem_login_aceitas: []               # 121 · Litoral preenchida em 22/09/2026 (Marcelo Silva, MPDSILVA · D-43). Posto vago conhecido entra aqui (D-18).
    aba: Hierarquia
    # nome no staging -> cabeçalhos aceitos. Vale a coluna cujo cabeçalho TERMINA com um deles (sem acento, caixa ou quebra de
    # linha). D-49: as colunas N1-N3, papel/nome do N4 e PROJETO continuam na planilha, mas nao sao mais lidas (a hierarquia e a
    # base comum); o arquivo nao foi alterado.
    colunas:
      N4_COD: ["(N4) CÓDIGO VEND./RCA"]
      LOGIN_MERCANET: ["LOGIN MERCANET", "LOGIN MERCATNET"]   # a 2ª grafia é a do arquivo de 17/09/2026
      NOME_MERCANET: ["NOME MERCANET"]
    colunas_opcionais:
      ENCERRADA_EM: ["ENCERRADA EM"]

  # D-49 (02/10/2026, decisoes 14/15 do Douglas): hierarquia oficial comum ao DN e ao Gerencial. Vale a Hierarquia_AAAAMMDD.xlsx
  # de data mais recente no nome; arquivo do padrao sem data valida aborta. A cadeia N1-N3 de cada vendedor (N4) sai SO das linhas
  # em que os clientes da rota estao com esse mesmo N4 na base (opcao B); cadeia ambigua aborta. Cliente da rota com outro N4 na
  # base fica com quem visita e vai para a lista de excecao. Rotulo "codigo - nome" (mesmo formato do DN e do Gerencial): o nome
  # e limpo so quando termina com "(codigo)" igual ao codigo da linha (sai o "(codigo)" e o "_" inicial).
  hierarquia:
    pasta: "../../bases compartilhadas"
    padrao: "Hierarquia_*.xlsx"
    data_regex: '^Hierarquia_(\d{8})\.xlsx$'
    aba: "Hierarquia Vendas"
    coluna_cliente: "Cód. cliente"
    niveis:                         # nivel -> [coluna do codigo, coluna do nome]
      N1: ["Cód. Head Vendas (N1)", "Nome Head Vendas (N1)"]
      N2: ["Cód. Gerente Vendas (N2)", "Nome Gerente Vendas (N2)"]
      N3: ["Cód. Executivo Vendas (N3)", "Nome Executivo Vendas (N3)"]
      N4: ["Cód. Representante (N4)", "Nome Representante (N4)"]

  # D-51 (02/10/2026, Douglas): o cadastro de nomes passou a ser a Estrutura de Clientes da pasta compartilhada (a mesma
  # que o Gerencial lê; vale a de data mais recente no nome). Medido antes: as 2.973 lojas da rota com o MESMO nome do
  # Clientes_Rota.xlsx (aposentado em _descartar/Clientes_Rota_aposentado_D51/); fora da rota, o nome passa a ser o do Gerencial (35 caracteres na origem).
  clientes:                         # D-38 · cadastro de nomes dos clientes · 1 linha = 1 cliente
    pasta: "../../bases compartilhadas"
    padrao: "Estrutura de Clientes_*.xlsx"
    data_regex: '^Estrutura de Clientes_(\d{8})\.xlsx$'
    obrigatorio: false              # false = arquivo ausente ou loja da rota sem nome nele gera AVISO; true = aborta
    aba: "Planilha1"
    colunas:
      "Cód. cliente": COD_CLIENTE
      "Cliente": NOME_CLIENTE

  sellin:                           # D-42 (22/09/2026) · P-16 · exports do BI (sell-in), COMPLEMENTO aos pedidos do Mercanet (não substitui)
    pasta: bases/SellIn             # 3 arquivos de nome fixo (os nomes do export do BI), substituídos todo dia, extraídos em sequência
    # D-45: mês FECHADO fica numa subpasta com o mês no nome (ex.: bases/SellIn/2026-09/) com os mesmos 3 arquivos, extraídos com o
    # filtro "Ano mês" daquele mês, uma vez, no dia 5 do mês seguinte. A raiz é sempre o mês corrente. O mês da subpasta tem de
    # ser o mês do conteúdo; o mesmo mês na raiz e numa subpasta aborta.
    subpasta_mes_regex: "^\\d{4}-\\d{2}$"
    obrigatorio: false              # false = arquivo ausente só avisa; true = aborta
    # Rodapé do export: linha "Total" (vira o GABARITO: a soma das linhas tem de bater), linha em branco e "Filtros aplicados..."
    # (descartada, com o texto guardado no staging-json). Linha que não é dado nem rodapé ABORTA.
    rotulo_total: Total
    prefixo_filtros: "Filtros aplicados"
    arquivos:
      cliente:                      # 1 linha = 1 cliente no mês, com a hierarquia N1–N4 do BI
        arquivo: Projeto Rota.xlsx
        chave: [COD_CLIENTE]
        colunas:
          "Ano mês": ANO_MES
          "Cód. cliente": COD_CLIENTE
          "Cliente": NOME_CLIENTE
          "Bandeira cliente": BANDEIRA
          "Cidade": CIDADE
          "Nome Head Vendas (N1)": N1_BI
          "Nome Gerente Vendas (N2)": N2_BI
          "Nome Executivo Vendas (N3)": N3_BI
          "Nome Vendedor Novo (N4)": N4_BI            # "RODRIGO MATOS (128)": o código entre parênteses vira COD_VENDEDOR
          "Receita Líquida Orçamento": ORCADO
          "Receita Líquida Carteira Total": CARTEIRA
          "Receita Líquida": RECEITA
          "Receita Líquida LY": RECEITA_LY
        valores: [ORCADO, CARTEIRA, RECEITA, RECEITA_LY]
      carteira:                     # 1 linha = 1 pedido em aberto (pode ser de mês anterior)
        arquivo: Projeto Rota Carteira.xlsx
        chave: [PEDIDO]
        colunas:
          "Ano mês": ANO_MES
          "Número pedido": PEDIDO
          "Data Pedido": DATA_PEDIDO
          "Cód. cliente": COD_CLIENTE
          "Receita Líquida Carteira Total": CARTEIRA
        valores: [CARTEIRA]
      faturado:                     # 1 linha = 1 pedido × data de faturamento (faturamento parcial = várias linhas); negativos entram como vêm
        arquivo: Proejto Rota Faturado.xlsx      # nome como exportado (com a grafia "Proejto")
        chave: [PEDIDO, DATA_FATURAMENTO]
        colunas:
          "Ano mês": ANO_MES
          "Numero Pedido": PEDIDO
          "Data Pedido": DATA_PEDIDO
          "Data Faturamento": DATA_FATURAMENTO
          "Cód. cliente": COD_CLIENTE
          "Receita Líquida": RECEITA
        valores: [RECEITA]
    # Conferências entre os 3 arquivos, por cliente (diferença vira AVISO + lista em data/rota/quality/, não aborta:
    # arquivos tirados em momentos diferentes divergem no que faturou entre um export e outro)
    conferir:
      - {detalhe: carteira, coluna: CARTEIRA, contra: CARTEIRA}
      - {detalhe: faturado, coluna: RECEITA, contra: RECEITA}

  # D-52 (02/10/2026, Douglas): META do sell-in por loja = arquivo de metas da pasta compartilhada, o MESMO do Gerencial
  # (D-74/D-87 de lá). Regras do leitor iguais às do Gerencial (rota/extract/metas.py). O orçado do export do BI fica só
  # como CONFERÊNCIA (aviso + lista em quality/). Ver `metas_sellin.fonte`.
  metas:
    pasta: "../../bases compartilhadas"
    padroes_aceitos: ["Metas_*.xlsx", "Metas_*.xlsm"]
    aba: null                       # null = a primeira aba ("Metas FY27")
    colunas:
      "CÓDIGO CLIENTE": COD_CLIENTE
      "CATEGORIA": CATEGORIA
      "Período": PERIODO
      "Tipo Meta": TIPO
      "Valor": VALOR
    tipos_meta:                     # o mesmo mapa do Gerencial; tipo fora daqui ABORTA. Só META_RECEITA é usada no ROTA
      "VALOR (R$)": META_RECEITA
      "VOLUME (KG)": META_PESO_KG

calendario:
  # Dia útil = segunda a sexta fora desta lista. Serve ao rótulo dos dias e à contagem "dia X de N"; o planejado vem SEMPRE das
  # datas da rota, não daqui. Parâmetro declarado (o protótipo 2 também trata 07/09/2026 como não útil) — manter atualizado.
  feriados: ["2026-09-07"]
  # D-44 (22/09/2026): o card "Semana" e a meta semanal do sell-in usam a MESMA semana.
  #   faixa_do_mes = as faixas de dias de `semanas_do_mes` (S1 = dias 1 a 7 ...), sempre as mesmas em todo mês
  #   segunda      = da segunda-feira até o dia selecionado (regra original da D-02; sem meta semanal de sell-in)
  semana: faixa_do_mes
  semanas_do_mes:                   # faixas contínuas a partir do dia 1; a última vai até 31 (cobre qualquer mês)
    - {nome: S1, de: 1, ate: 7}
    - {nome: S2, de: 8, ate: 14}
    - {nome: S3, de: 15, ate: 21}
    - {nome: S4, de: 22, ate: 31}

metas_sellin:                       # D-44 (22/09/2026) · meta do sell-in = orçado do mês (lojas da rota) repartido pelas semanas
  # PESOS EM DISCUSSÃO COM O TIME: para mudar, editar os números abaixo e rodar `python run_rota.py` de novo (nada no código).
  # Um peso por semana de `calendario.semanas_do_mes`, em %, somando 100 — senão o pipeline ABORTA.
  # Meta da semana = orçado × peso da semana. Meta até a data = orçado × soma dos pesos até a semana do dia, contada inteira.
  pesos: {S1: 30, S2: 30, S3: 20, S4: 20}
  pesos_por_mes: {}                 # exceção de um mês, ex.: {"2026-12": {S1: 40, S2: 30, S3: 20, S4: 10}}
  # D-52 (02/10/2026): de onde vem o "orçado" de cada loja da rota.
  #   metas = arquivo de metas da pasta compartilhada (`fontes.metas`, o mesmo do Gerencial); mês que não estiver no arquivo
  #           usa o orçado do BI daquele mês, com AVISO
  #   bi    = `Receita Líquida Orçamento` do export do BI (regra da D-44; deixa de fora as lojas que o export não traz)
  fonte: metas

regras:                             # D-02: regras do protótipo 2 (conferidas em 100% dos casos contra os dados embutidos nele)
  visita:
    # 1 visita = 1 cliente × dia com QUALQUER evento. O protótipo conta também o dia que só tem CHECKOUT (15 casos em set/26);
    # para exigir check-in, deixar só [CHECKIN]. Mantido em 18/09/2026 (D-34).
    eventos_que_contam: [CHECKIN, CHECKOUT]
    # minutos em loja = o MAIOR par check-in -> check-out do cliente no dia; cada check-out pareia com o último check-in antes dele.
    minutos_minimos: null           # D-31 (18/09/2026): sem duração mínima — toda visita vale (null); com número, visita sem par também não vale
    # D-32 (18/09/2026): dias em que o evento NÃO conta como visita (a linha fica na FATO_VISITA, marcada em DIA_NAO_CONTA).
    # Valores aceitos: segunda, terca, quarta, quinta, sexta, sabado, domingo e feriado (= as datas de `calendario.feriados`).
    # Para rever a regra basta editar a lista: [] = todo dia conta; [sabado, domingo] = feriado volta a contar.
    dias_que_nao_contam: [sabado, domingo, feriado]
  nome_cliente:
    # D-38 (18/09/2026): de onde vem o nome da loja, em ordem de prioridade — vale a primeira fonte que tiver o nome.
    # clientes = Estrutura de Clientes_AAAAMMDD.xlsx da pasta compartilhada (D-51; nome cortado em 35 caracteres na origem)
    # rota     = coluna `Nome cliente` da rota mensal, se um dia vier · mercanet = pedido ou check-in mais recente (nome completo)
    # Para rever: reordenar a lista (ex.: [mercanet, clientes] mostra o nome completo quando existir). Fonte fora da lista não é usada.
    precedencia: [clientes, rota, mercanet]
  canais_sem_controle_de_visita: [TELEFONE]    # acompanhados só por pedido (D-02)
  pedido:
    situacoes_excluidas: ["Cancelado", "Bloqueado"]   # D-33 (18/09/2026): Bloqueado NÃO conta como pedido tirado (o protótipo 2 contava)
    coluna_valor: VALOR_PEDIDO                 # é a coluna que o protótipo 2 usa (o rodapé dele diz "bruto − desconto", mas o dado é este)
    # D-25 (17/09/2026): "com pedido" = a loja tem pedido válido NO MÊS até a data (mesma lógica da aderência, D-03).
    # "janela" = regra do protótipo 2 (dia da rota + N dias corridos); continua calculada na LOJA_MES e serve à reconciliação.
    criterio: mes                              # mes | janela
    janela_dias_corridos: 1                    # o pedido conta para a loja se emitido no dia da rota ou até N dias CORRIDOS depois (P-13)

painel:
  arquivo: Painel_Rota.html         # nome estável do arquivo publicado (D-05)
  niveis_gerados: [N1, N2, N3]      # D-21: 1 head + 3 gerentes + 5 supervisores = 9 painéis. Gerados em pasta local; publicação só ao final (D-28)
  # D-45 (22/09/2026): um único Painel_Rota.html por usuário com o mês corrente + os últimos N meses fechados (seletor de mês na tela).
  # Mês fechado = mês anterior ao corrente presente nas bases, congelado no último dia. 0 = só o mês corrente.
  meses_fechados: 12
  # tabela e gráfico abrem neste período (dia | sem | mes); o botão Período continua na tela
  periodo_inicial: mes
  faixas:                           # cores dos percentuais: >= verde, >= ambar, abaixo vermelho (protótipo 2: 90/60)
    verde: 90
    ambar: 60
  faixas_meta_sellin:               # D-44: cores do "% da meta até a data" do sell-in (>= verde, >= ambar, abaixo vermelho)
    verde: 100
    ambar: 80
  rotulo_valor: "Valor dos pedidos"   # D-35 (18/09/2026): o painel mostra o valor bruto = `Valor total do pedido` dos pedidos válidos; a quantidade solicitada saiu

publicacao:                         # D-39 · etapa 6. Destino = <destino>/<rótulo da visão>/<painel.arquivo> (D-05)
  liberada: true                    # D-28: TRAVA. LIBERADA em 02/10/2026 pelo Douglas ("pode fazer o ensaio e publicar"; D-50). Era false desde 18/09.
                                    # Com false, `python run_rota.py --publicar` recusa e não copia nada.
  destino: "../../../Painéis Comerciais/Gerencial"          # relativo à raiz do projeto (ROTA/), como no DN; as 9 pastas já existem
  pasta_ensaio: "%LOCALAPPDATA%/Dori/ROTA/ensaio_publicacao/Gerencial"   # `--ensaio` copia para cá (pasta local), nunca para o destino real
  criar_pasta: true                 # pasta do usuário inexistente: criar e avisar (D-05). false = erro naquela visão
  pular_se_identico: true           # mesmo md5 do já publicado = nada é copiado (o OneDrive não ressincroniza)

qualidade:                          # só para os relatórios de exceção; não muda nenhum número
  visita_curta_min: 1
  visita_longa_min: 120

validacao:
  tolerancia_reconciliacao: 0.05    # diferença absoluta aceita entre a soma das linhas e o rodapé da fonte
  html_max_mb: 5                    # teto do HTML de cada painel (esperado < 1 MB)
  base_velha_horas: 36              # aviso quando o arquivo mais novo de check-ins/pedidos é mais antigo que isto (R-03)
