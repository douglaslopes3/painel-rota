# Configuração do Painel de Rota (pipeline único `run_rota.py`).
# Toda regra declarada aqui vem de decisão registrada em docs/10_DECISOES.md (D-nn) ou está marcada como pendência (P-nn).
# Caminhos relativos são resolvidos a partir da raiz do projeto (a pasta ROTA/); absolutos passam direto.

projeto:
  nome: Painel de Rota · Projeto Rota (Atacado)
  pasta_dados: data/rota            # staging/, curated/, quality/ ficam aqui
  pasta_logs: data/rota/logs
  # JSON e HTML de cada execução nascem numa pasta LOCAL, fora do OneDrive (padrão do DN); só o publicado vai para a pasta sincronizada
  pasta_painel: "%LOCALAPPDATA%/Dori/ROTA/painel"

logs:
  manter_ultimos: 30                # logs e resumos de execução mantidos

fontes:
  # O MÊS de cada arquivo vem do CONTEÚDO (datas), nunca do nome. Dois arquivos da mesma fonte com o mesmo mês abortam:
  # substituir o arquivo do mês corrente, nunca adicionar (versão antiga vai para uma subpasta, ex.: _versoes/, que não é lida).
  rota:                             # rota planejada do mês · 1 linha = 1 cliente · construída pelo time de Atacado
    pasta: bases/Rota
    padroes_aceitos: ["Rota_*.xlsx"]
    aba: Base de Clientes
    # a coluna de data traz o mês no nome ("Datas Rota Setembro"): é localizada por padrão, sem acento e sem caixa (P-05)
    coluna_data_regex: "^DATAS? ROTA"
    colunas:                        # nome na planilha -> nome no staging
      "Supervisor": SUPERVISOR
      "Executivo": EXECUTIVO
      "Cód. cliente": COD_CLIENTE
      "canal": CANAL
      "cidade": CIDADE
      "Net Sales 25": NET_SALES_25
      "Net Sales 26": NET_SALES_26
      "Frequência anual 2025": FREQ_25
      "Frequência anual 2026": FREQ_26
      "Volume 25": VOLUME_25
      "Volume 26": VOLUME_26
    # Código do vendedor (N4 da hierarquia: 107, 118...). É a chave rota ↔ hierarquia (D-17): resiste a homônimo, troca de
    # pessoa e posição vaga. Enquanto a coluna não existir na planilha, a ligação é pelo NOME do executivo.
    colunas_opcionais:
      "Cód. vendedor": COD_VENDEDOR
    canais_esperados: [PRESENCIAL, TELEFONE]      # gabarito de conferência: valor fora da lista vira aviso, não é corrigido

  checkins:                         # Mercanet · timeline de check-in/check-out · 1 linha = 1 evento · extração acumulada do mês (D-06)
    pasta: bases/Mercanet
    padroes_aceitos: ["*.csv"]
    separador: ";"
    encoding: cp1252
    formato_data: "%d/%m/%Y %H:%M:%S"
    colunas:
      "USUÁRIO": LOGIN
      "NOME USUÁRIO": NOME_USUARIO
      "DATA EVENTO": DATA_HORA
      "CÓDIGO CLIENTE": COD_CLIENTE
      "NOME CLIENTE": NOME_CLIENTE
      "CIDADE CLIENTE": CIDADE
      "ESTADO": UF
      "EVENTO TIME LINE": EVENTO
    # NÃO vão para o staging (minimização, Etapa 7): ENDEREÇO CLIENTE, DESCRIÇÃO TIMELINE, LATITUDE e LONGITUDE (truncadas em inteiro na origem)
    eventos_esperados: [CHECKIN, CHECKOUT]
    logins_ignorados:               # descartados na leitura, contados no log. A confirmar pelo Gui na aba Logins_sem_executivo do de-para (P-01)
      TESTERTM: "usuário de teste (1 check-in em 01/09/2026, no cliente 1012816)"

  pedidos:                          # Mercanet · consulta de pedidos · 1 linha = 1 pedido · canal Atacado inteiro · acumulada do mês
    pasta: bases/Pedidos
    padroes_aceitos: ["*.csv"]
    separador: ";"
    encoding: cp1252
    formato_data: "%d/%m/%Y"
    colunas:
      "Pedido": PEDIDO
      "Código": COD_CLIENTE
      "Cliente": NOME_CLIENTE
      "Data de emissão": DATA_EMISSAO
      "Data Estimada de Entrega": DATA_ENTREGA_ESTIMADA
      "Data de faturamento": DATA_FATURAMENTO
      "Situação": SITUACAO
      "Valor total do pedido": VALOR_PEDIDO
      "Quantidade solicitada": QTD_SOLICITADA          # unidade não declarada na origem (P-02)
      "Valor total bruto": VALOR_BRUTO
      "Valor desconto": VALOR_DESCONTO
      "Representante": REPRESENTANTE
      "Cidade": CIDADE
      "UF": UF
    # NÃO vão para o staging: Ordem de compra, Sit. Embarque, Nota fiscal, Cliente CNPJ (17 são CPF), Desconto médio, Preço médio liquido
    # a última linha do arquivo é um rodapé de totais: sai dos dados e vira o GABARITO de reconciliação
    reconciliar: [VALOR_PEDIDO, QTD_SOLICITADA, VALOR_BRUTO]
    situacoes_esperadas: ["Aberto", "Fatur. Parcial", "Faturado", "Fatur. + Canc.", "Bloqueado", "Cancelado"]

  estrutura:                        # hierarquia N1–N4 do Projeto Rota + login do Mercanet, no formato da Hierarquia_Consolidada (D-16)
    arquivo: bases/Estrutura/DePara_Estrutura_Rota.xlsx
    obrigatorio: false              # false enquanto o de-para não fecha (ausência/pendência = aviso); true = aborta (D-15)
    aba: Hierarquia
    # nome no staging -> cabeçalhos aceitos. Vale a coluna cujo cabeçalho TERMINA com um deles (sem acento, caixa ou quebra de
    # linha): "CRIAR NO BI / (N1) / HEAD" casa com "(N1) HEAD". As visões (painéis) saem de N1, N2 e N3; não são digitadas.
    colunas:
      N1_COD: ["(N1) CÓDIGO HEAD"]
      N1_PAPEL: ["(N1) HEAD"]
      N1_NOME: ["(N1) NOME HEAD"]
      N2_COD: ["(N2) CÓDIGO GERENTE"]
      N2_PAPEL: ["(N2) GERENTE"]
      N2_NOME: ["(N2) NOME GERENTE"]
      N3_COD: ["(N3) CÓDIGO SUP./EXEC."]
      N3_PAPEL: ["(N3) SUP./EXEC."]
      N3_NOME: ["(N3) NOME SUP./EXEC."]
      N4_COD: ["(N4) CÓDIGO VEND./RCA"]
      N4_PAPEL: ["(N4) VEND./RCA"]
      N4_NOME: ["(N4) NOME VEND./RCA"]          # tem de ser igual ao `Executivo` da rota enquanto a rota não trouxer o código
      PROJETO: ["PROJETO"]
      LOGIN_MERCANET: ["LOGIN MERCANET", "LOGIN MERCATNET"]   # a 2ª grafia é a do arquivo de 17/09/2026
      NOME_MERCANET: ["NOME MERCANET"]

calendario:
  # Dia útil = segunda a sexta fora desta lista. Serve ao rótulo dos dias e à contagem "dia X de N"; o planejado vem SEMPRE das
  # datas da rota, não daqui. Parâmetro declarado (o protótipo 2 também trata 07/09/2026 como não útil) — manter atualizado.
  feriados: ["2026-09-07"]
  semana_inicio: segunda            # D-02: semana = da segunda-feira até o dia selecionado

regras:                             # D-02: regras do protótipo 2 (conferidas em 100% dos casos contra os dados embutidos nele)
  visita:
    # 1 visita = 1 cliente × dia com QUALQUER evento. O protótipo conta também o dia que só tem CHECKOUT (15 casos em set/26);
    # para exigir check-in, deixar só [CHECKIN]. (P-12)
    eventos_que_contam: [CHECKIN, CHECKOUT]
    # minutos em loja = o MAIOR par check-in -> check-out do cliente no dia; cada check-out pareia com o último check-in antes dele.
    minutos_minimos: null           # P-04: duração mínima para a visita valer (null = toda visita vale)
  canais_sem_controle_de_visita: [TELEFONE]    # acompanhados só por pedido (D-02)
  pedido:
    situacoes_excluidas: ["Cancelado"]         # P-09: Bloqueado conta (como no protótipo 2)
    coluna_valor: VALOR_PEDIDO                 # é a coluna que o protótipo 2 usa (o rodapé dele diz "bruto − desconto", mas o dado é este)
    janela_dias_corridos: 1                    # o pedido conta para a loja se emitido no dia da rota ou até N dias CORRIDOS depois (P-13)

qualidade:                          # só para os relatórios de exceção; não muda nenhum número
  visita_curta_min: 1
  visita_longa_min: 120

validacao:
  tolerancia_reconciliacao: 0.05    # diferença absoluta aceita entre a soma das linhas e o rodapé da fonte
  base_velha_horas: 36              # aviso quando o arquivo mais novo de check-ins/pedidos é mais antigo que isto (R-03)
